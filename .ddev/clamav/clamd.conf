Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 8
CommandReadTimeout 10
ReadTimeout 360
StreamMaxLength 1024M
MaxScanTime 300000
MaxScanSize 3072M
MaxFileSize 1024M
MaxRecursion 16
MaxFiles 10000
ScanArchive yes
HeuristicAlerts yes
AlertEncrypted yes
AlertExceedsMax yes
ConcurrentDatabaseReload no
SelfCheck 600
FailIfCvdOlderThan 3
LogTime yes
