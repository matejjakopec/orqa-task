name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: ci
      APP_DEBUG: 'false'
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: orqa_ci
      DB_USERNAME: db
      DB_PASSWORD: db
      DB_URL: ''
      BCRYPT_ROUNDS: '4'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: orqa_ci
          MARIADB_USER: db
          MARIADB_PASSWORD: db
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, fileinfo, dom, xml, curl, intl, zip
          coverage: none
          tools: composer:v2
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Resolve the CI database host
        run: echo '127.0.0.1 db' | sudo tee -a /etc/hosts
      - name: Validate Composer files
        run: composer validate --strict
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure the application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Build production assets
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Verify migrations and production-safe role seeding
        run: |
          php artisan migrate --no-interaction
          php artisan db:seed --no-interaction
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Analyse application types
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Compile Blade templates
        run: php artisan view:cache
